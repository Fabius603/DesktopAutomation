name: Release (Windows / Velopack + MSIX)

on:
  push:
    branches:
      - master
    paths:
      - 'DesktopAutomationApp/DesktopAutomationApp.csproj'
      - '.github/workflows/release.yml'
      - 'eng/build-msix.ps1'
      - 'eng/publish-app.ps1'
      - 'packaging/msix/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-win:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read version from csproj
        id: ver
        shell: pwsh
        run: |
          [xml]$csproj = Get-Content "DesktopAutomationApp/DesktopAutomationApp.csproj"
          $version = $csproj.Project.PropertyGroup.Version | Select-Object -First 1
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "TAG=v$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "Detected version: $version"

      - name: Check if release already exists
        id: check
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ steps.ver.outputs.TAG }}"

          $releases = gh release list --limit 100 --json tagName | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw "Failed to list GitHub releases." }
          $exists = $releases.tagName -contains $tag

          if ($exists) { Write-Host "Release $tag already exists; published artifacts are immutable." }

          "EXISTS=$($exists.ToString().ToLowerInvariant())" |
            Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Setup .NET
        if: steps.check.outputs.EXISTS == 'false'
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Cache NuGet
        if: steps.check.outputs.EXISTS == 'false'
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Verify repository
        if: steps.check.outputs.EXISTS == 'false'
        shell: pwsh
        run: .\eng\verify.ps1 -Mode Full

      - name: Upload verification results
        if: always() && steps.check.outputs.EXISTS == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: release-verification-results
          path: |
            artifacts/verify/**
            !artifacts/verify/bin/**
            !artifacts/verify/obj/**
          retention-days: 14
          if-no-files-found: error

      - name: Publish self-contained (win-x64)
        if: steps.check.outputs.EXISTS == 'false'
        shell: pwsh
        run: .\eng\publish-app.ps1 -OutputDirectory out/win-x64

      - name: Build MSIX from the same publish output
        if: steps.check.outputs.EXISTS == 'false'
        shell: pwsh
        env:
          MSIX_IDENTITY_NAME: ${{ vars.MSIX_IDENTITY_NAME }}
          MSIX_PUBLISHER: ${{ vars.MSIX_PUBLISHER }}
          MSIX_PUBLISHER_DISPLAY_NAME: ${{ vars.MSIX_PUBLISHER_DISPLAY_NAME }}
        run: |
          $configured = @($env:MSIX_IDENTITY_NAME, $env:MSIX_PUBLISHER, $env:MSIX_PUBLISHER_DISPLAY_NAME) |
            Where-Object { -not [string]::IsNullOrWhiteSpace($_) }
          if ($configured.Count -eq 0) {
            Write-Host "Partner Center is not configured; generating a development MSIX, not a Store submission."
            $env:MSIX_IDENTITY_NAME = "DesktopAutomation.LocalTest"
            $env:MSIX_PUBLISHER = "CN=DesktopAutomation.LocalTest"
            $env:MSIX_PUBLISHER_DISPLAY_NAME = "DesktopAutomation"
          } elseif ($configured.Count -ne 3) { throw "All three MSIX identity variables are required." }
          .\eng\build-msix.ps1 -PublishDirectory out/win-x64 -IdentityName $env:MSIX_IDENTITY_NAME `
            -Publisher $env:MSIX_PUBLISHER -PublisherDisplayName $env:MSIX_PUBLISHER_DISPLAY_NAME

      - name: Upload MSIX for manual Store submission or development testing
        if: steps.check.outputs.EXISTS == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: msix-${{ steps.ver.outputs.VERSION }}
          path: |
            artifacts/msix/*.msix
            artifacts/msix/package.json
          if-no-files-found: error

      - name: Install Velopack CLI
        if: steps.check.outputs.EXISTS == 'false'
        run: dotnet tool install vpk --tool-path ./.tools --version 1.2.0

      - name: Download previous Velopack release
        if: steps.check.outputs.EXISTS == 'false'
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./.tools/vpk download github `
            --repoUrl "https://github.com/${{ github.repository }}" `
            --token "$env:GITHUB_TOKEN" `
            --outputDir Releases

      - name: Build Velopack packages and installer
        if: steps.check.outputs.EXISTS == 'false'
        shell: pwsh
        env:
          VELOPACK_SIGN_PARAMS: ${{ secrets.VELOPACK_SIGN_PARAMS }}
        run: |
          $signingArguments = @()
          if (-not [string]::IsNullOrWhiteSpace($env:VELOPACK_SIGN_PARAMS)) {
            $signingArguments = @("--signParams", $env:VELOPACK_SIGN_PARAMS)
          }
          ./.tools/vpk pack `
            --packId "Fabius603.DesktopAutomation" `
            --packVersion "${{ steps.ver.outputs.VERSION }}" `
            --packDir "out/win-x64" `
            --mainExe "DesktopAutomationApp.exe" `
            --packTitle "DesktopAutomation" `
            --packAuthors "Fabius603" `
            --runtime "win-x64" `
            --framework "vcredist143-x64" `
            --icon "DesktopAutomationApp/Assets/App.ico" `
            --outputDir Releases @signingArguments
          if ($LASTEXITCODE -ne 0) { throw "Velopack packaging failed." }

      - name: Upload draft GitHub release
        if: steps.check.outputs.EXISTS == 'false'
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./.tools/vpk upload github `
            --repoUrl "https://github.com/${{ github.repository }}" `
            --token "$env:GITHUB_TOKEN" `
            --outputDir Releases `
            --releaseName "DesktopAutomation ${{ steps.ver.outputs.VERSION }}" `
            --tag "${{ steps.ver.outputs.TAG }}"

      - name: Rename installer and publish release
        if: steps.check.outputs.EXISTS == 'false'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $originalName = "Fabius603.DesktopAutomation-win-Setup.exe"
          $installerName = "DesktopAutomation-Setup.exe"
          $portableName = "Fabius603.DesktopAutomation-win-Portable.zip"
          $installerPath = Join-Path "Releases" $installerName

          Copy-Item `
            -LiteralPath (Join-Path "Releases" $originalName) `
            -Destination $installerPath

          gh release upload "${{ steps.ver.outputs.TAG }}" $installerPath --clobber
          if ($LASTEXITCODE -ne 0) { throw "Failed to upload renamed installer." }

          gh release delete-asset "${{ steps.ver.outputs.TAG }}" $originalName --yes
          if ($LASTEXITCODE -ne 0) { throw "Failed to remove original installer asset." }

          gh release delete-asset "${{ steps.ver.outputs.TAG }}" $portableName --yes
          if ($LASTEXITCODE -ne 0) { throw "Failed to remove portable release asset." }

          $releaseNotes = @"
          ## Installation

          Bitte ausschließlich **DesktopAutomation-Setup.exe** herunterladen und ausführen.

          Die übrigen Dateien sind technische Velopack-Dateien für automatische Updates
          und nicht für die manuelle Installation vorgesehen.
          "@

          gh release edit "${{ steps.ver.outputs.TAG }}" `
            --notes $releaseNotes `
            --draft=false `
            --latest
          if ($LASTEXITCODE -ne 0) { throw "Failed to publish release." }
